version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pss_db
    environment:
      POSTGRES_DB: pixelstarships
      POSTGRES_USER: pss_user
      POSTGRES_PASSWORD: pss_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    networks:
      - pss_network
    restart: unless-stopped

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pss_backend
    environment:
      - DATABASE_URL=postgresql://pss_user:pss_password@db:5432/pixelstarships
      - ALLOWED_HOSTS=http://localhost:3000,http://frontend,http://127.0.0.1:3000
      - PSS_API_BASE_URL=https://api.pixelstarships.com
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - pss_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React/Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pss_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pss_network
    restart: unless-stopped

  # Redis para caché (opcional)
  redis:
    image: redis:7-alpine
    container_name: pss_redis
    ports:
      - "6379:6379"
    networks:
      - pss_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  pss_network:
    driver: bridge