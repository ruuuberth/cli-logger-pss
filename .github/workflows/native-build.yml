name: Native Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Download standalone mitmproxy (linux)
        env:
          MITMPROXY_VERSION: "11.0.2"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mitmproxy.tar.gz "https://downloads.mitmproxy.org/${MITMPROXY_VERSION}/mitmproxy-${MITMPROXY_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /tmp/mitmproxy
          tar -xzf /tmp/mitmproxy.tar.gz -C /tmp/mitmproxy
          echo "MITMPROXY_BUNDLE_DIR=$(find /tmp/mitmproxy -maxdepth 1 -type d -name 'mitmproxy-*' | head -n1)" >> "$GITHUB_ENV"

      - name: Build executable
        env:
          PSS_BUILD_VERSION: ci-${{ github.ref_name }}
          PSS_BUILD_GIT_SHA: ${{ github.sha }}
          PSS_BUILD_SOURCE: native-build
        run: ./scripts/build.sh

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Run build verification tests
        run: python3 -m pytest -q tests/test_api_flow_capture.py tests/test_build_info.py

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Download standalone mitmproxy (windows)
        env:
          MITMPROXY_VERSION: "11.0.2"
        run: |
          $url = "https://downloads.mitmproxy.org/$env:MITMPROXY_VERSION/mitmproxy-$env:MITMPROXY_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\mitmproxy.zip"
          $extractRoot = "$env:TEMP\mitmproxy"
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -Path "$env:TEMP\mitmproxy.zip" -DestinationPath $extractRoot -Force
          $bundle = Get-ChildItem $extractRoot -Directory | Select-Object -First 1
          "MITMPROXY_BUNDLE_DIR=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        env:
          PSS_BUILD_VERSION: ci-${{ github.ref_name }}
          PSS_BUILD_GIT_SHA: ${{ github.sha }}
          PSS_BUILD_SOURCE: native-build
        run: ./scripts/build.ps1
