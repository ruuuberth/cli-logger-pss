name: Native Build

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Build executable
        run: ./scripts/build.sh

      - name: Run addon capture tests
        run: python3 -m pytest -q tests/test_api_flow_capture.py

      - name: Prepare artifact payload
        run: |
          mkdir -p dist/upload
          cp dist/pss-logger-native dist/upload/pss-logger-native
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platform=linux"
            echo "python=3.11"
            echo "project_version=$(python -c \"import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])\")"
          } > dist/upload/build-metadata.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-linux
          path: native_app/dist/upload/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Build executable
        run: ./scripts/build.ps1

      - name: Prepare artifact payload
        run: |
          New-Item -ItemType Directory -Path dist/upload -Force | Out-Null
          Copy-Item dist/pss-logger-native.exe dist/upload/pss-logger-native-windows.exe -Force
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          @(
            "commit=$env:GITHUB_SHA"
            "branch=$env:GITHUB_REF_NAME"
            "built_at=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "platform=windows"
            "python=3.11"
            "project_version=$version"
          ) | Set-Content dist/upload/build-metadata.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-windows.exe
          path: native_app/dist/upload/*
          if-no-files-found: error
