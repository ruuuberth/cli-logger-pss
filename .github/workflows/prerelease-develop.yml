name: Native Pre-release (develop)

on:
  push:
    branches:
      - develop
    paths:
      - 'native_app/**'
      - '.github/workflows/**'
      - '.env.example'
      - '.env.dev.example'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-develop
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Build executable
        run: ./scripts/build.sh

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-linux
          path: native_app/dist/pss-logger-native
          if-no-files-found: error

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Build executable
        run: ./scripts/build.ps1

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-windows.exe
          path: native_app/dist/pss-logger-native.exe
          if-no-files-found: error

  publish-prerelease:
    name: Publish develop pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move develop-latest tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f develop-latest "${GITHUB_SHA}"
          git push origin refs/tags/develop-latest --force

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pss-logger-native-linux
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pss-logger-native-windows.exe
          path: dist

      - name: Normalize filenames
        run: |
          test -f dist/pss-logger-native
          test -f dist/pss-logger-native.exe
          mv dist/pss-logger-native.exe dist/pss-logger-native-windows.exe

      - name: Generate checksums
        run: |
          cd dist
          sha256sum pss-logger-native pss-logger-native-windows.exe > SHA256SUMS.txt

      - name: Optional signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          cd dist
          if [ -n "${SIGNING_PRIVATE_KEY:-}" ]; then
            echo "${SIGNING_PRIVATE_KEY}" | gpg --batch --import
            if [ -n "${SIGNING_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "${SIGNING_PASSPHRASE}" --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            else
              gpg --batch --yes --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            fi
          else
            echo "::warning::SIGNING_PRIVATE_KEY not configured. Skipping signature generation."
          fi

      - name: Build pre-release file list
        id: release_files
        run: |
          set -euo pipefail
          files=$'dist/pss-logger-native\ndist/pss-logger-native-windows.exe\ndist/SHA256SUMS.txt'
          if [ -f dist/SHA256SUMS.txt.asc ]; then
            files+=$'\ndist/SHA256SUMS.txt.asc'
          fi
          {
            echo "paths<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: develop-latest
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          name: "Develop Pre-release (${{ github.sha }})"
          body: |
            Canal automático de pre-release para `develop`.

            Commit: `${{ github.sha }}`
            Workflow run: `${{ github.run_id }}`
          files: ${{ steps.release_files.outputs.paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
