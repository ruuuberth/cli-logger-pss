name: Native Pre-release (develop)

on:
  push:
    branches:
      - develop
    paths:
      - 'native_app/**'
      - '.github/workflows/**'
      - '.env.example'
      - '.env.dev.example'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-develop
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Download standalone mitmproxy (linux)
        env:
          MITMPROXY_VERSION: "11.0.2"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mitmproxy.tar.gz "https://downloads.mitmproxy.org/${MITMPROXY_VERSION}/mitmproxy-${MITMPROXY_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /tmp/mitmproxy
          tar -xzf /tmp/mitmproxy.tar.gz -C /tmp/mitmproxy
          echo "MITMPROXY_BUNDLE_DIR=$(find /tmp/mitmproxy -maxdepth 1 -type d -name 'mitmproxy-*' | head -n1)" >> "$GITHUB_ENV"

      - name: Build executable
        run: ./scripts/build.sh

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-linux
          path: native_app/dist/pss-logger-native-linux-portable.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: native_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Download standalone mitmproxy (windows)
        env:
          MITMPROXY_VERSION: "11.0.2"
        run: |
          $url = "https://downloads.mitmproxy.org/$env:MITMPROXY_VERSION/mitmproxy-$env:MITMPROXY_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\mitmproxy.zip"
          $extractRoot = "$env:TEMP\mitmproxy"
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -Path "$env:TEMP\mitmproxy.zip" -DestinationPath $extractRoot -Force
          $bundle = Get-ChildItem $extractRoot -Directory | Select-Object -First 1
          "MITMPROXY_BUNDLE_DIR=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        run: ./scripts/build.ps1

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pss-logger-native-windows
          path: native_app/dist/pss-logger-native-windows-portable.zip
          if-no-files-found: error

  publish-prerelease:
    name: Publish develop pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move develop-latest tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f develop-latest "${GITHUB_SHA}"
          git push origin refs/tags/develop-latest --force

      - name: Remove legacy assets from existing develop-latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/develop-latest" 2>/dev/null || true)"
          if [ -z "${release_json}" ]; then
            echo "No existing develop-latest release found. Skipping cleanup."
            exit 0
          fi
          export RELEASE_JSON="${release_json}"
          python3 - <<'PY'
          import json
          import os
          import subprocess

          release = json.loads(os.environ["RELEASE_JSON"])
          release_id = release.get("id")
          if not release_id:
              print("No release id found for develop-latest payload. Skipping cleanup.")
              raise SystemExit(0)
          assets = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{release_id}/assets"],
              text=True,
          )
          asset_rows = json.loads(assets)
          legacy_names = {"pss-logger-native", "pss-logger-native-windows.exe"}
          for asset in asset_rows:
              if asset.get("name") in legacy_names:
                  asset_id = asset["id"]
                  subprocess.check_call(
                      ["gh", "api", "-X", "DELETE", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset_id}"]
                  )
                  print(f"Deleted legacy asset: {asset['name']}")
          PY

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pss-logger-native-linux
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pss-logger-native-windows
          path: dist

      - name: Normalize filenames
        run: |
          test -f dist/pss-logger-native-linux-portable.zip
          test -f dist/pss-logger-native-windows-portable.zip

      - name: Generate checksums
        run: |
          cd dist
          sha256sum pss-logger-native-linux-portable.zip pss-logger-native-windows-portable.zip > SHA256SUMS.txt

      - name: Optional signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          cd dist
          if [ -n "${SIGNING_PRIVATE_KEY:-}" ]; then
            echo "${SIGNING_PRIVATE_KEY}" | gpg --batch --import
            if [ -n "${SIGNING_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "${SIGNING_PASSPHRASE}" --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            else
              gpg --batch --yes --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            fi
          else
            echo "::warning::SIGNING_PRIVATE_KEY not configured. Skipping signature generation."
          fi

      - name: Build pre-release file list
        id: release_files
        run: |
          set -euo pipefail
          files=$'dist/pss-logger-native-linux-portable.zip\ndist/pss-logger-native-windows-portable.zip\ndist/SHA256SUMS.txt'
          if [ -f dist/SHA256SUMS.txt.asc ]; then
            files+=$'\ndist/SHA256SUMS.txt.asc'
          fi
          {
            echo "paths<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: develop-latest
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          name: "Develop Pre-release (${{ github.sha }})"
          body: |
            Canal automático de pre-release para `develop`.

            Commit: `${{ github.sha }}`
            Workflow run: `${{ github.run_id }}`
          files: ${{ steps.release_files.outputs.paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
