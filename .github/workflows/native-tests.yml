name: Native Tests

# Functional validation for develop-branch PRs. native-build.yml (full
# Linux+Windows PyInstaller builds) still only runs on PRs to main.
# pytest-windows exists so the win32-only tests in
# tests/test_api_flow_capture.py actually execute somewhere (issue #20).

on:
  pull_request:
    # `edited` lets a base-branch retarget (stacked PRs) re-trigger CI; the
    # default types alone (opened/synchronize/reopened) skip it. Jobs guard
    # on `changes.base` below so title/body edits don't waste a run.
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-linux:
    name: Pytest (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # On pull_request `edited`, only run when the base branch changed
    # (retarget); skip title/body/label edits. Non-edited events always run.
    if: github.event.action != 'edited' || github.event.changes.base != null

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install package with dev extra
        working-directory: native_app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: native_app
        run: |
          python -m ruff check app/ tests/
          python -m ruff format --check app/ tests/

      - name: Run test suite
        working-directory: native_app
        run: python -m pytest -q

      - name: Test summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: native_app/.pytest_cache/
          if-no-files-found: ignore
          retention-days: 3

  pytest-windows:
    name: Pytest (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    # On pull_request `edited`, only run when the base branch changed
    # (retarget); skip title/body/label edits. Non-edited events always run.
    if: github.event.action != 'edited' || github.event.changes.base != null

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            native_app/pyproject.toml
            native_app/requirements.txt

      - name: Install package with dev extra
        working-directory: native_app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: native_app
        run: |
          python -m ruff check app/ tests/
          python -m ruff format --check app/ tests/

      - name: Run test suite
        working-directory: native_app
        run: python -m pytest -q

      - name: Test summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-windows
          path: native_app/.pytest_cache/
          if-no-files-found: ignore
          retention-days: 3
