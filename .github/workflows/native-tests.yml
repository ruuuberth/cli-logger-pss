name: Native Tests

# Functional validation for develop-branch PRs. native-build.yml (full
# Linux+Windows PyInstaller builds) still only runs on PRs to main.
# This job is intentionally lightweight: pytest on Linux, no packaging.

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-linux:
    name: Pytest (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with dev extra
        working-directory: native_app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        working-directory: native_app
        run: python -m pytest -q

      - name: Test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: native_app/.pytest_cache/
          if-no-files-found: ignore
          retention-days: 3
