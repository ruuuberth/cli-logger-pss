[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pss-logger-native"
version = "0.1.0"
description = "Native desktop app for PixelStarships Logger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.8.0.2",
  "mitmproxy==11.0.2",
  "sqlalchemy==2.0.38",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "python-dotenv==1.0.0",
]

[project.scripts]
pss-native = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
